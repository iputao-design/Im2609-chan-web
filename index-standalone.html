<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IM2609 缠论 K线走势</title>
    <style>
:root {
  color-scheme: light;
  --bg: #eef2f7;
  --panel: #ffffff;
  --text: #172033;
  --muted: #64748b;
  --line: #d8e0ea;
  --grid: #edf2f7;
  --up: #d62828;
  --down: #148f4f;
  --stroke: #2563eb;
  --shadow: 0 18px 45px rgba(15, 23, 42, 0.12);
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
}

button,
input {
  font: inherit;
}

.app-shell {
  width: min(1680px, calc(100vw - 32px));
  margin: 18px auto 26px;
}

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 14px;
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 0;
}

.status {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  color: #475569;
  font-size: 13px;
}

.status span {
  padding: 7px 10px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.72);
}

.level-switch {
  display: inline-flex;
  gap: 4px;
  margin: 0 0 12px;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  box-shadow: var(--shadow);
}

.level-switch button {
  min-width: 64px;
  height: 32px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #475569;
  cursor: pointer;
  font-weight: 700;
}

.level-switch button.active {
  background: #172033;
  color: #fff;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 12px;
}

.metrics div,
.chart-panel,
.detail-panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.metrics div {
  padding: 13px 15px;
}

.metrics span {
  display: block;
  color: var(--muted);
  font-size: 13px;
}

.metrics strong {
  display: block;
  margin-top: 6px;
  font-size: 22px;
  letter-spacing: 0;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 12px;
  min-height: calc(100vh - 180px);
}

.chart-panel {
  min-width: 0;
  overflow: hidden;
}

.chart-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 48px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}

.legend,
.actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.legend span {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #334155;
  font-size: 13px;
}

.legend b {
  font: inherit;
  font-weight: 400;
}

.legend i {
  display: inline-block;
  width: 18px;
  height: 10px;
  border-radius: 2px;
}

.legend .up {
  background: var(--up);
}

.legend .down {
  background: var(--down);
}

.legend .stroke {
  height: 3px;
  background: var(--stroke);
}

.legend .rsi-yellow,
.legend .rsi-green,
.legend .rsi-red {
  width: 12px;
  height: 12px;
  border: 2px solid currentColor;
  border-radius: 50%;
  background: transparent;
}

.legend .rsi-yellow {
  color: #f4c430;
}

.legend .rsi-green {
  color: #16a34a;
}

.legend .rsi-red {
  color: #dc2626;
}

.actions button {
  min-width: 54px;
  height: 30px;
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  background: #f8fafc;
  color: #1f2937;
  cursor: pointer;
}

.actions button:hover {
  background: #edf2f7;
}

.canvas-wrap {
  position: relative;
  height: calc(100vh - 270px);
  min-height: 560px;
  cursor: crosshair;
  background: #ffffff;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

.tooltip {
  position: absolute;
  z-index: 4;
  min-width: 230px;
  max-width: 300px;
  padding: 10px 11px;
  border: 1px solid #cbd5e1;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 14px 30px rgba(15, 23, 42, 0.16);
  color: #1f2937;
  font-size: 13px;
  pointer-events: none;
}

.tooltip strong {
  display: block;
  margin-bottom: 5px;
}

.tooltip p {
  margin: 3px 0;
  color: #475569;
}

.slider-row {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 10px 13px 14px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}

#panSlider {
  width: 100%;
  accent-color: var(--stroke);
}

.detail-panel {
  padding: 18px;
}

.detail-panel h2 {
  margin: 0 0 14px;
  font-size: 19px;
}

dl {
  margin: 0;
}

dl div {
  padding: 12px 0;
  border-bottom: 1px solid #e5eaf0;
}

dt {
  color: var(--muted);
  font-size: 12px;
}

dd {
  margin: 5px 0 0;
  line-height: 1.45;
  font-size: 14px;
  word-break: break-word;
}

.hint {
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  background: #f8fafc;
  color: #64748b;
  font-size: 13px;
  line-height: 1.55;
}

.hint p {
  margin: 0 0 8px;
}

.hint p:last-child {
  margin-bottom: 0;
}

@media (max-width: 980px) {
  .app-shell {
    width: min(100vw - 20px, 980px);
  }

  .topbar {
    align-items: flex-start;
    flex-direction: column;
  }

  .metrics {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .workspace {
    grid-template-columns: 1fr;
  }

  .canvas-wrap {
    height: 62vh;
    min-height: 460px;
  }
}

@media (max-width: 560px) {
  h1 {
    font-size: 23px;
  }

  .metrics {
    grid-template-columns: 1fr;
  }

  .chart-toolbar {
    align-items: flex-start;
    flex-direction: column;
  }
}

</style>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Chan Stroke Monitor</p>
          <h1>IM2609 缠论 K线走势</h1>
        </div>
        <div class="status">

          <span id="updatedLabel">--</span>

      <section class="level-switch" aria-label="级别切换">

        <button data-level="30F" type="button">30F</button>

      <section class="metrics" aria-label="统计摘要">
        <div>

        <div>

          <strong id="maxStroke">--</strong>

        <div>

          <strong id="windowInfo">--</strong>
        </div>
      </section>

      <section class="workspace">
        <div class="chart-panel">
          <div class="chart-toolbar">
            <div class="legend">
              <span><i class="up"></i>上涨K线</span>
              <span><i class="down"></i>下跌K线</span>

              <span><i class="rsi-red"></i>RSI6&lt;5</span>

            <div class="actions">
              <button id="zoomOut" type="button">缩小</button>
              <button id="zoomIn" type="button">放大</button>
              <button id="resetView" type="button">全览</button>
            </div>
          </div>
          <div class="canvas-wrap" id="canvasWrap">
            <canvas id="chart"></canvas>
            <div id="tooltip" class="tooltip" hidden></div>
          </div>
          <div class="slider-row">
            <span>上市以来</span>
            <input id="panSlider" type="range" min="0" max="0" value="0" />
            <span>最新</span>
          </div>
        </div>

        <aside class="detail-panel">
          <h2>滑动查看</h2>
          <dl id="barDetails">
            <div><dt>时间</dt><dd>--</dd></div>
            <div><dt>开高低收</dt><dd>--</dd></div>
            <div><dt>成交量</dt><dd>--</dd></div>
            <div><dt>RSI(6)</dt><dd>--</dd></div>
            <div><dt>所属一笔</dt><dd>--</dd></div>
            <div><dt>一笔区间</dt><dd>--</dd></div>
            <div><dt>一笔振幅</dt><dd>--</dd></div>
          </dl>
          <div class="hint">
            <p>拖动画布平移，滚轮缩放；底部滑杆快速切换时间段。</p>
            <p>蓝色线连接每笔起止分型，悬停任意 K 线会显示对应一笔。</p>
          </div>
        </aside>
      </section>
    </main>

    dpr,
    left: 68,
    right: 78,
    top: 24,
    bottom: 42,
    volumeHeight: Math.max(92, height * 0.18),
    gap: 20,
  };
}

function draw() {
  if (!state.data) return;
  const m = canvasMetrics();
  const ctx = canvas.getContext("2d");
  ctx.setTransform(m.dpr, 0, 0, m.dpr, 0, 0);
  ctx.clearRect(0, 0, m.width, m.height);
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, m.width, m.height);

  const bars = visibleBars();
  if (!bars.length) return;

  const priceBottom = m.height - m.bottom - m.volumeHeight - m.gap;
  const priceTop = m.top;
  const volumeTop = priceBottom + m.gap;
  const volumeBottom = m.height - m.bottom;
  const plotWidth = m.width - m.left - m.right;
  const priceHeight = priceBottom - priceTop;
  const step = plotWidth / Math.max(1, bars.length - 1);
  const candleWidth = Math.max(2, Math.min(10, step * 0.62));
  const high = Math.max(...bars.map((b) => b.high));
  const low = Math.min(...bars.map((b) => b.low));
  const pad = Math.max((high - low) * 0.06, 8);
  const yMax = high + pad;
  const yMin = low - pad;
  const maxVol = Math.max(...bars.map((b) => b.volume), 1);

  const xFor = (index) => m.left + (index - state.start) * step;
  const yFor = (price) => priceTop + ((yMax - price) / (yMax - yMin)) * priceHeight;

  ctx.strokeStyle = "#d8e0ea";
  ctx.lineWidth = 1;
  ctx.strokeRect(m.left, priceTop, plotWidth, priceHeight);
  ctx.strokeRect(m.left, volumeTop, plotWidth, volumeBottom - volumeTop);

  ctx.font = "12px Arial";
  ctx.fillStyle = "#64748b";
  ctx.textAlign = "left";
  ctx.fillText("Price", m.left, 16);
  ctx.fillText("Volume", m.left, volumeTop - 7);

  ctx.strokeStyle = "#edf2f7";
  ctx.fillStyle = "#64748b";
  ctx.textAlign = "right";
  for (let i = 0; i <= 6; i += 1) {
    const price = yMin + ((yMax - yMin) * i) / 6;
    const y = yFor(price);
    ctx.beginPath();
    ctx.moveTo(m.left, y);
    ctx.lineTo(m.width - m.right, y);
    ctx.stroke();
    ctx.fillText(fmt.format(price), m.width - 8, y + 4);
  }

  const dayMarks = [];
  let lastDay = "";
  bars.forEach((bar) => {
    const day = bar.time.slice(5, 10);
    if (day !== lastDay) {
      dayMarks.push(bar.index);
      lastDay = day;
    }
  });
  ctx.textAlign = "center";
  ctx.strokeStyle = "#f1f5f9";
  ctx.fillStyle = "#64748b";
  const skip = dayMarks.length > 14 ? 2 : 1;
  dayMarks.forEach((index, markNo) => {
    const x = xFor(index);
    ctx.beginPath();
    ctx.moveTo(x, priceTop);
    ctx.lineTo(x, volumeBottom);
    ctx.stroke();
    if (markNo % skip === 0) {
      ctx.fillText(state.bars[index].time.slice(5, 10), x, volumeBottom + 20);
    }
  });

  bars.forEach((bar) => {
    const x = xFor(bar.index);
    const up = bar.close >= bar.open;
    const color = up ? "#d62828" : "#148f4f";
    const yHigh = yFor(bar.high);
    const yLow = yFor(bar.low);
    const yOpen = yFor(bar.open);
    const yClose = yFor(bar.close);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, yHigh);
    ctx.lineTo(x, yLow);
    ctx.stroke();
    const bodyTop = Math.min(yOpen, yClose);
    const bodyBottom = Math.max(yOpen, yClose);
    if (bodyBottom - bodyTop < 1) {
      ctx.fillRect(x - candleWidth / 2, bodyTop, candleWidth, 1);
    } else {
      ctx.fillRect(x - candleWidth / 2, bodyTop, candleWidth, bodyBottom - bodyTop);
    }

    const volHeight = (bar.volume / maxVol) * (volumeBottom - volumeTop);
    ctx.globalAlpha = 0.82;
    ctx.fillRect(x - candleWidth / 2, volumeBottom - volHeight, candleWidth, volHeight);
    ctx.globalAlpha = 1;
  });

  ctx.strokeStyle = "#2563eb";
  ctx.lineWidth = 2.4;
  ctx.beginPath();
  let started = false;
  state.strokes.forEach((stroke) => {
    const points = [
      [stroke.startIndex, stroke.startPrice],
      [stroke.endIndex, stroke.endPrice],
    ];
    points.forEach(([index, price]) => {
      if (index == null || index < state.start || index > state.start + state.count - 1) return;
      const x = xFor(index);
      const y = yFor(price);
      if (!started) {
        ctx.moveTo(x, y);
        started = true;
      } else {
        ctx.lineTo(x, y);
      }
    });
  });
  ctx.stroke();
  ctx.lineWidth = 1;

  bars.forEach((bar) => {
    const color = markerColor(bar.rsiMarker);
    if (!color) return;
    const stroke = byStroke(bar.strokeNo);
    const markerPrice = priceOnStroke(bar, stroke);
    if (markerPrice == null) return;
    const x = xFor(bar.index);
    const y = yFor(markerPrice);
    ctx.save();
    ctx.strokeStyle = color;
    ctx.fillStyle = "rgba(255, 255, 255, 0.78)";
    ctx.lineWidth = bar.rsiMarker === "red" ? 3 : 2.5;
    const radius = bar.rsiMarker === "red" ? 7 : bar.rsiMarker === "green" ? 6 : 5;
    ctx.beginPath();
    ctx.arc(x, y, radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  });

  if (state.hoverIndex != null) {
    const bar = state.bars[state.hoverIndex];
    if (bar && bar.index >= state.start && bar.index < state.start + state.count) {
      const x = xFor(bar.index);
      const y = yFor(bar.close);
      ctx.strokeStyle = "#0f172a";
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.moveTo(x, priceTop);
      ctx.lineTo(x, volumeBottom);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(m.left, y);
      ctx.lineTo(m.width - m.right, y);
      ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = "#0f172a";
      ctx.fillText(fmt.format(bar.close), m.width - 8, y - 6);
    }
  }
}

function updateSummary() {
  const summary = state.data.summary;
  document.querySelectorAll("[data-level]").forEach((button) => {
    button.classList.toggle("active", button.dataset.level === state.level);
  });
  document.getElementById("strokeLegend").textContent = `${state.level}一笔`;
  document.getElementById("rangeLabel").textContent = `${summary.start_time} - ${summary.end_time}`;
  document.getElementById("updatedLabel").textContent = `网页数据生成：${state.rootData.updatedAt}`;
  document.getElementById("totalAmp").textContent = `${fmt.format(num(summary.total_space_points))} 点`;
  document.getElementById("strokeCount").textContent = `${summary.stroke_count} 笔`;
  document.getElementById("avgStroke").textContent = `${fmt.format(num(summary.avg_space_points))} 点`;
  document.getElementById("minStroke").textContent = `${fmt.format(num(summary.min_space_points))} 点`;
  document.getElementById("maxStroke").textContent = `${fmt.format(num(summary.max_space_points))} 点`;
  updateWindowInfo();
}

function updateWindowInfo() {
  const first = state.bars[state.start];
  const last = state.bars[Math.min(state.bars.length - 1, state.start + state.count - 1)];
  document.getElementById("windowInfo").textContent = first && last ? `${dateShort(first.time)} - ${dateShort(last.time)}` : "--";
}

function updateDetails(index) {
  const bar = state.bars[index];
  const slots = details.querySelectorAll("dd");
  if (!bar) {
    slots.forEach((slot) => {
      slot.textContent = "--";
    });
    return;
  }
  const stroke = byStroke(bar.strokeNo);
  slots[0].textContent = bar.time;
  slots[1].textContent = `O ${fmt.format(bar.open)} / H ${fmt.format(bar.high)} / L ${fmt.format(bar.low)} / C ${fmt.format(bar.close)}`;
  slots[2].textContent = `${fmt.format(bar.volume)}，持仓 ${fmt.format(bar.openInterest)}`;
  slots[3].textContent = `${fmt.format(bar.rsi6)}${bar.rsiMarker ? `，${bar.rsiMarker === "red" ? "红圈" : bar.rsiMarker === "green" ? "绿圈" : "黄圈"}` : ""}`;
  slots[4].textContent = stroke ? `${state.level}第 ${stroke.strokeNo} 笔，${stroke.direction === "up" ? "向上" : "向下"}` : "未归属已确认一笔";
  slots[5].textContent = stroke ? `${dateShort(stroke.startTime)} -> ${dateShort(stroke.endTime)}` : "--";
  slots[6].textContent = stroke ? `${fmt.format(stroke.spacePoints)} 点，${pctFmt.format(stroke.spacePct)}%` : "--";
}

function showTooltip(index, clientX, clientY) {
  const bar = state.bars[index];
  if (!bar) return;
  const stroke = byStroke(bar.strokeNo);
  tooltip.hidden = false;
  tooltip.innerHTML = `
    <strong>${bar.time}</strong>
    <p>开 ${fmt.format(bar.open)}　高 ${fmt.format(bar.high)}　低 ${fmt.format(bar.low)}　收 ${fmt.format(bar.close)}</p>
    <p>RSI(6) ${fmt.format(bar.rsi6)}${bar.rsiMarker ? `　${bar.rsiMarker === "red" ? "红圈" : bar.rsiMarker === "green" ? "绿圈" : "黄圈"}` : ""}</p>
    <p>成交量 ${fmt.format(bar.volume)}　持仓 ${fmt.format(bar.openInterest)}</p>
    <p>${stroke ? `${state.level}第 ${stroke.strokeNo} 笔 ${stroke.direction === "up" ? "向上" : "向下"}，振幅 ${fmt.format(stroke.spacePoints)} 点` : "未归属已确认一笔"}</p>
  `;
  const wrapRect = wrap.getBoundingClientRect();
  const left = clamp(clientX - wrapRect.left + 14, 10, wrapRect.width - tooltip.offsetWidth - 12);
  const top = clamp(clientY - wrapRect.top + 14, 10, wrapRect.height - tooltip.offsetHeight - 12);
  tooltip.style.left = `${left}px`;
  tooltip.style.top = `${top}px`;
}

function indexFromEvent(event) {
  const m = canvasMetrics();
  const rect = canvas.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const plotWidth = m.width - m.left - m.right;
  const rel = clamp(x - m.left, 0, plotWidth);
  const offset = Math.round((rel / plotWidth) * Math.max(1, state.count - 1));
  return clamp(state.start + offset, 0, state.bars.length - 1);
}

function setStart(value) {
  state.start = clamp(Math.round(value), 0, Math.max(0, state.bars.length - state.count));
  slider.value = String(state.start);
  updateWindowInfo();
  draw();
}

function setCount(nextCount, anchorIndex = state.start + Math.floor(state.count / 2)) {
  const oldCount = state.count;
  state.count = clamp(Math.round(nextCount), 36, state.bars.length);
  const ratio = oldCount ? (anchorIndex - state.start) / oldCount : 0.5;
  const nextStart = anchorIndex - ratio * state.count;
  slider.max = String(Math.max(0, state.bars.length - state.count));
  setStart(nextStart);
}

function bindEvents() {
  window.addEventListener("resize", draw);
  document.querySelectorAll("[data-level]").forEach((button) => {
    button.addEventListener("click", () => setLevel(button.dataset.level));
  });
  slider.addEventListener("input", () => setStart(Number(slider.value)));
  document.getElementById("zoomIn").addEventListener("click", () => setCount(state.count * 0.72));
  document.getElementById("zoomOut").addEventListener("click", () => setCount(state.count * 1.38));
  document.getElementById("resetView").addEventListener("click", () => {
    state.count = state.bars.length;
    slider.max = "0";
    setStart(0);
  });

  canvas.addEventListener("mousemove", (event) => {
    if (state.dragging) {
      const m = canvasMetrics();
      const dx = event.clientX - state.dragX;
      const plotWidth = m.width - m.left - m.right;
      const barsDelta = Math.round((-dx / plotWidth) * state.count);
      setStart(state.dragStart + barsDelta);
      return;
    }
    const index = indexFromEvent(event);
    state.hoverIndex = index;
    updateDetails(index);
    showTooltip(index, event.clientX, event.clientY);
    draw();
  });

  canvas.addEventListener("mouseleave", () => {
    if (!state.dragging) {
      tooltip.hidden = true;
      state.hoverIndex = null;
      draw();
    }
  });

  canvas.addEventListener("mousedown", (event) => {
    state.dragging = true;
    state.dragX = event.clientX;
    state.dragStart = state.start;
    wrap.style.cursor = "grabbing";
  });

  window.addEventListener("mouseup", () => {
    state.dragging = false;
    wrap.style.cursor = "crosshair";
  });

  canvas.addEventListener(
    "wheel",
    (event) => {
      event.preventDefault();
      const anchor = indexFromEvent(event);
      const factor = event.deltaY < 0 ? 0.82 : 1.18;
      setCount(state.count * factor, anchor);
    },
    { passive: false },
  );
}

function setLevel(level) {
  const data = levelData(level);
  if (!data) return;
  state.level = level;
  state.data = data;
  state.bars = state.data.bars;
  state.strokes = state.data.strokes;
  state.count = Math.min(260, state.bars.length);
  state.start = Math.max(0, state.bars.length - state.count);
  slider.max = String(Math.max(0, state.bars.length - state.count));
  slider.value = String(state.start);
  state.hoverIndex = null;
  tooltip.hidden = true;
  updateSummary();
  updateDetails(state.bars.length - 1);
  draw();
}

async function init() {
  if (window.IM2609_DATA) {
    state.rootData = window.IM2609_DATA;
  } else {
    const response = await fetch(`./im2609-data.json?v=${Date.now()}`, { cache: "no-store" });
    if (!response.ok) throw new Error(`读取数据失败：${response.status}`);
    state.rootData = await response.json();
  }
  state.level = state.rootData.defaultLevel || state.rootData.level || "5F";
  setLevel(state.level);
  bindEvents();
}

init().catch((error) => {
  wrap.innerHTML = `<div class="hint">网页数据读取失败：${error.message}</div>`;
});

</script>
  </body>
</html>
